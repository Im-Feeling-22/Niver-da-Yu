<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playlist | Festa Ploc</title>

    <link rel="icon" type="image/png" href="img/LogoY.png">
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

<header class="navbar">

    <img
        src="img/decoracoes/quad.png"
        class="patins-header patins-quad"
        alt=""
        aria-hidden="true"
    >
    <a href="index.html" class="logo">
        <div class="logo-principal">
            <span class="logo-festa">FESTA</span>
            <span class="logo-ploc">PLOC</span>
        </div>

        <span class="logo-yu">Niver da Yu</span>
    </a>
    <img
        src="img/decoracoes/inline.png"
        class="patins-header patins-inline"
        alt=""
        aria-hidden="true"
    >

    <nav class="menu">
        <a href="index.html">
            HOME
        </a>

        <a href="playlist.html" class="ativo">
            PLAYLIST
        </a>

        <a href="formulario.html" class="menu-contato">
            CONTATO
        </a>
    </nav>

</header>

<main class="playlist-page">

    <!-- DECORAÇÕES -->

    <img src="img/decoracoes/fx_roxo.png"
         class="arte playlist-fx-roxo" alt="">

    <img src="img/decoracoes/fx_azul.png"
         class="arte playlist-fx-azul" alt="">

    <img src="img/decoracoes/raio_azul.png"
         class="arte playlist-raio" alt="">

    <img src="img/decoracoes/estrela_rosa.png"
         class="arte playlist-estrela" alt="">

    <img src="img/decoracoes/ziguezague_amarelo.png"
         class="arte playlist-ziguezague" alt="">

    <img src="img/decoracoes/triangulo_rosa.png"
         class="arte playlist-triangulo" alt="">

    <img src="img/decoracoes/rabisco_rosa.png"
         class="arte playlist-rabisco-rosa" alt="">

    <img src="img/decoracoes/rabisco_azul.png"
         class="arte playlist-rabisco-azul" alt="">

    <img src="img/decoracoes/bolinhas_preto.png"
         class="arte playlist-bolinhas" alt="">

    <section class="playlist-cabecalho">

        <div class="titulo-grafico">
            <img
                src="img/decoracoes/fx_rosa.png"
                class="fundo-titulo"
                alt=""
            >
            <h1>PLAYLIST</h1>
        </div>

        <p>
            Escolha sua música e arrase no karaokê!
        </p>

    </section>

    <section class="playlist-card">

        <img
            src="img/decoracoes/x_amarelo.png"
            class="x-card"
            alt=""
        >

        <h2>CATÁLOGO DE MÚSICAS</h2>

        <div class="barra-pesquisa">

            <span class="icone-pesquisa">⌕</span>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar música ou cantor..."
                autocomplete="off"
            >
        </div>

        <div class="codigo-colapsado">
            <table class="tabela-musicas">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Cantor</th>
                        <th>Música</th>
                    </tr>
                </thead>
                <tbody id="catalogo"></tbody>
            </table>
        </div>
    </section>

</main>

<footer class="footer">

    <p>
        Copyright © 2026 - Niver da Yu.
        Todos os direitos reservados.
    </p>

    <img
        src="img/decoracoes/coracao_rosa.png"
        class="footer-coracao"
        alt=""
    >

</footer>

<script src="js/catalogo.js"></script>
<script src="js/index.js"></script>

</body>
</html>
