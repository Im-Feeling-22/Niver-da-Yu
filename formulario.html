<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mensagem | Festa Ploc</title>

    <link rel="icon"
          type="image/png"
          href="img/LogoY.png">

    <link rel="stylesheet"
          href="css/estilo.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/jquery-toast-plugin/1.3.2/jquery.toast.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-toast-plugin/1.3.2/jquery.toast.min.js"></script>

</head>

<body>
<header class="navbar">

    <img
        src="img/decoracoes/quad.png"
        class="patins-header patins-quad"
        alt=""
        aria-hidden="true"
    >
    <a href="index.html" class="logo">
        <div class="logo-principal">
            <span class="logo-festa">FESTA</span>
            <span class="logo-ploc">PLOC</span>
        </div>

        <span class="logo-yu">Niver da Yu</span>
    </a>
    <img
        src="img/decoracoes/inline.png"
        class="patins-header patins-inline"
        alt=""
        aria-hidden="true"
    >

    <nav class="menu">

        <a href="index.html">
            HOME
        </a>

        <a href="playlist.html">
            PLAYLIST
        </a>

        <a
            href="formulario.html"
            class="menu-contato ativo-contato"
        >
            CONTATO
        </a>
    </nav>
</header>

<main class="contato-page">
    <!-- DECORAÇÕES -->

    <img
        src="img/decoracoes/fx_amarela.png"
        class="arte contato-fx-amarelo"
        alt=""
    >

    <img
        src="img/decoracoes/seta_rosa.png"
        class="arte contato-seta"
        alt=""
    >

    <img
        src="img/decoracoes/x_roxo.png"
        class="arte contato-x"
        alt=""
    >

    <img
        src="img/decoracoes/triangulo_azul.png"
        class="arte contato-triangulo"
        alt=""
    >

    <img
        src="img/decoracoes/raio_rosa.png"
        class="arte contato-raio"
        alt=""
    >

    <img
        src="img/decoracoes/bolinhas_rosa.png"
        class="arte contato-bolinhas"
        alt=""
    >

    <section class="formulario">
        <img
            src="img/decoracoes/coracao_rosa.png"
            class="coracao-formulario"
            alt=""
        >

        <span class="mini-titulo">
            DEIXE SEU RECADO
        </span>

        <h1>
            MANDE UMA<br>
            <strong>MENSAGEM!</strong>
        </h1>

        <p>
            Escreva uma mensagem especial para a Yu
            e faça parte dessa festa!
        </p>

        <form
            onsubmit="event.preventDefault(); abrirGmail();"
        >

            <label for="assunto">
                ASSUNTO
            </label>

            <input
                type="text"
                id="assunto"
                name="assunto"
                placeholder="Digite o assunto..."
                required
            >

            <label for="mensagem">
                SUA MENSAGEM
            </label>

            <textarea
                name="mensagem"
                id="mensagem"
                placeholder="Escreva sua mensagem..."
                rows="6"
                required
            ></textarea>

            <button type="submit">
                ENVIAR MENSAGEM
            </button>

        </form>

    </section>

</main>

<footer class="footer">

    <p>
        Copyright © 2026 - Niver da Yu.
        Todos os direitos reservados.
    </p>

    <img
        src="img/decoracoes/coracao_rosa.png"
        class="footer-coracao"
        alt=""
    >
</footer>

<script src="js/index.js"></script>

</body>
</html>
